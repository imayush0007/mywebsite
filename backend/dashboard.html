<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex,nofollow">

<title>Ayush Rai | AI Portfolio Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#020617,#071126,#0f172a);
    color:white;
    padding:30px;
}

h1{
    text-align:center;
    color:#38bdf8;
    margin-bottom:10px;
    font-size:42px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:35px;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:#0f172a;
    border:1px solid rgba(56,189,248,.3);
    border-radius:18px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 18px rgba(56,189,248,.15);
}

.stat-card h2{
    color:#38bdf8;
    font-size:38px;
    margin-bottom:10px;
}

.stat-card p{
    color:#94a3b8;
}

.top-bar{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.refresh{
    background:#0ea5e9;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
}

.refresh:hover{
    background:#0284c7;
}

#searchBox{
    flex:1;
    min-width:220px;
    background:#111827;
    color:white;
    border:none;
    padding:14px;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.table{
    overflow-x:auto;
    background:#08111f;
    border-radius:16px;
    padding:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#111827;
    color:#38bdf8;
    padding:16px;
    text-align:left;
}

td{
    padding:15px;
    border-bottom:1px solid #1f2937;
}

tr:hover{
    background:#101d35;
}

.delete-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

.delete-btn:hover{
    background:#dc2626;
}

.status{
    color:#22c55e;
    font-weight:bold;
}

footer{
    margin-top:30px;
    text-align:center;
    color:#64748b;
}

@media(max-width:768px){

    body{
        padding:15px;
    }

    h1{
        font-size:30px;
    }

    th,td{
        padding:10px;
        font-size:14px;
    }

}
</style>

</head>
<body>

<h1>📩 Ayush AI Portfolio Dashboard</h1>
<p class="subtitle">Live Messages • Render Backend • GitHub Portfolio</p>

<div class="stats-grid">

    <div class="stat-card">
        <h2 id="totalMsg">0</h2>
        <p>Total Messages</p>
    </div>

    <div class="stat-card">
        <h2 id="emailCount">0</h2>
        <p>Unique Emails</p>
    </div>

    <div class="stat-card">
        <h2 class="status">LIVE</h2>
        <p>Backend Status</p>
    </div>

</div>

<div class="top-bar">

    <button class="refresh" onclick="loadMessages()">
        🔄 Refresh
    </button>

    <input
        id="searchBox"
        placeholder="🔍 Search by Name or Email..."
    >

</div>

<div class="table">

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Message</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="messageTable"></tbody>

</table>

</div>

<footer>
    Ayush Rai • AI Portfolio Dashboard • Auto Refresh Every 10 Seconds
</footer>

<script>

const API = "https://ayush-ai-backend.onrender.com";

let allMessages = [];

async function loadMessages(){

    try{

        const response = await fetch(API + "/messages");
        allMessages = await response.json();

        renderMessages(allMessages);

        document.getElementById("totalMsg").innerText =
            allMessages.length;

        const uniqueEmails =
            [...new Set(allMessages.map(msg => msg.email))];

        document.getElementById("emailCount").innerText =
            uniqueEmails.length;

    }

    catch(error){

        alert("Unable to connect to backend.");

    }

}

function renderMessages(messages){

    const table = document.getElementById("messageTable");
    table.innerHTML = "";

    messages.forEach(msg=>{

        table.innerHTML += `
        <tr>

            <td>${msg.id}</td>

            <td>${msg.name}</td>

            <td>${msg.email}</td>

            <td>${msg.message}</td>

            <td>
                <button
                    class="delete-btn"
                    onclick="deleteMessage(${msg.id})"
                >
                    Delete
                </button>
            </td>

        </tr>
        `;

    });

}

async function deleteMessage(id){

    const ok = confirm("Delete this message?");

    if(!ok) return;

    await fetch(API + "/delete/" + id,{
        method:"DELETE"
    });

    loadMessages();

}

document
.getElementById("searchBox")
.addEventListener("input",function(e){

    const value =
        e.target.value.toLowerCase();

    const filtered =
        allMessages.filter(msg=>

            msg.name.toLowerCase().includes(value) ||

            msg.email.toLowerCase().includes(value)

        );

    renderMessages(filtered);

});

setInterval(loadMessages,10000);

loadMessages();

</script>

</body>
</html>
