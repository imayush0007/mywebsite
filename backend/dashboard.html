<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayush Rai | Admin Dashboard</title>

    <link rel="icon" href="../profile.jpeg?v=2" type="image/jpeg">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#020617;
            color:white;
            padding:40px;
        }

        h1{
            text-align:center;
            color:#38bdf8;
            font-size:40px;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#94a3b8;
            margin-bottom:30px;
        }

        .table-box{
            background:#0f172a;
            padding:20px;
            border-radius:20px;
            box-shadow:0 0 25px rgba(56,189,248,.2);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            padding:15px;
            border-bottom:1px solid rgba(255,255,255,.1);
            text-align:left;
        }

        th{
            background:#1e293b;
            color:#38bdf8;
        }

        tr:hover{
            background:#16213d;
        }

        button{
            padding:8px 14px;
            border:none;
            border-radius:8px;
            color:white;
            cursor:pointer;
            transition:.3s;
            font-weight:bold;
        }

        .view-btn{
            background:#2563eb;
        }

        .view-btn:hover{
            background:#1d4ed8;
        }

        .delete-btn{
            background:#ef4444;
            margin-left:8px;
        }

        .delete-btn:hover{
            background:#dc2626;
        }

        /* ===== Popup ===== */

        .modal{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.75);
            justify-content:center;
            align-items:center;
            z-index:1000;
        }

        .modal-content{
            background:#0f172a;
            width:450px;
            max-width:90%;
            padding:25px;
            border-radius:20px;
            border:1px solid #38bdf8;
            box-shadow:0 0 30px rgba(56,189,248,.4);
        }

        .modal-content h2{
            color:#38bdf8;
            margin-bottom:20px;
        }

        .modal-content p{
            color:white;
            text-align:left;
            margin:12px 0;
            line-height:1.6;
        }

        .close-btn{
            width:100%;
            margin-top:20px;
            background:#ef4444;
            padding:12px;
            font-size:16px;
        }

        .close-btn:hover{
            background:#dc2626;
        }
    </style>
</head>

<body>

    <h1>📥 Portfolio Inbox</h1>
    <p>Messages received from your portfolio website.</p>

    <div class="table-box">
        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Message</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="messageTable">
                <tr>
                    <td colspan="4" style="text-align:center;color:#94a3b8;">
                        Loading messages...
                    </td>
                </tr>
            </tbody>

        </table>
    </div>

    <!-- ===== JavaScript ===== -->

    <script>
        async function loadMessages() {

            const table = document.getElementById("messageTable");

            try {

                const response = await fetch("http://127.0.0.1:8000/messages");
                const messages = await response.json();

                if (messages.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="4" style="text-align:center;color:#94a3b8;">
                                No messages found.
                            </td>
                        </tr>`;
                    return;
                }

                table.innerHTML = "";

                messages.forEach(msg => {

                    table.innerHTML += `
                        <tr>
                            <td>${msg.name}</td>
                            <td>${msg.email}</td>
                            <td>${msg.message}</td>

                            <td>
                                <button class="view-btn"
                                    onclick="showPopup('${msg.name}','${msg.email}','${msg.message}')">
                                    View
                                </button>

                                <button class="delete-btn"
                                    onclick="deleteMessage(${msg.id})">
                                    Delete
                                </button>
                            </td>
                        </tr>`;
                });

            } catch (err) {

                table.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align:center;color:red;">
                            Backend not connected!
                        </td>
                    </tr>`;

                console.error(err);
            }
        }

        loadMessages();

        // ===== Popup =====

        function showPopup(name, email, message) {

            document.getElementById("pName").innerText = name;
            document.getElementById("pEmail").innerText = email;
            document.getElementById("pMessage").innerText = message;

            document.getElementById("popup").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("popup").style.display = "none";
        }

        // ===== Delete Message =====

        async function deleteMessage(id) {

            const ok = confirm("Are you sure you want to delete this message?");

            if (!ok) return;

            await fetch(`http://127.0.0.1:8000/delete/${id}`, {
                method: "DELETE"
            });

            loadMessages();
        }
    </script>

    <!-- ===== Popup ===== -->

    <div class="modal" id="popup">

        <div class="modal-content">

            <h2>📩 Message Details</h2>

            <p><b>Name:</b> <span id="pName"></span></p>

            <p><b>Email:</b> <span id="pEmail"></span></p>

            <p><b>Message:</b></p>

            <p id="pMessage"></p>

            <button class="close-btn" onclick="closePopup()">
                Close
            </button>

        </div>

    </div>

</body>
</html>
