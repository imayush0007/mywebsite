<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayush Rai | Admin Dashboard</title>
<style>
body{
background:#050816;
color:white;
font-family:Arial;
padding:30px;
}

h1{
text-align:center;
color:#38bdf8;
}

.table{
margin-top:30px;
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:15px;
border-bottom:1px solid #1f2937;
text-align:left;
}

th{
background:#111827;
}

tr:hover{
background:#0f172a;
}

button{
background:#ef4444;
color:white;
padding:8px 15px;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#dc2626;
}

.refresh{
background:#0ea5e9;
margin-bottom:20px;
}
</style>
</head>
<body>

<h1>📩 Ayush AI Portfolio Dashboard</h1>

<button class="refresh" onclick="loadMessages()">🔄 Refresh Messages</button>

<div class="table">
<table>
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Message</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="messageTable"></tbody>
</table>
</div>

<script>
const API="https://ayush-ai-backend.onrender.com";

async function loadMessages(){
const res=await fetch(API+"/messages");
const data=await res.json();

const table=document.getElementById("messageTable");
table.innerHTML="";

data.forEach(msg=>{
table.innerHTML+=`
<tr>
<td>${msg.id}</td>
<td>${msg.name}</td>
<td>${msg.email}</td>
<td>${msg.message}</td>
<td><button onclick="deleteMessage(${msg.id})">Delete</button></td>
</tr>`;
});
}

async function deleteMessage(id){
if(!confirm("Delete this message?")) return;
await fetch(API+"/delete/"+id,{method:"DELETE"});
loadMessages();
}

loadMessages();
</script>

</body>
</html>
