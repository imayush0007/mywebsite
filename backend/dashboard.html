<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayush Rai | AI Portfolio Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
padding:30px;
}

h1{
text-align:center;
font-size:42px;
color:#38bdf8;
margin-bottom:30px;
}

/* STATS */

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.stat-card{
background:#0f172a;
padding:25px;
border-radius:18px;
text-align:center;
border:1px solid #38bdf8;
box-shadow:0 0 20px rgba(56,189,248,.2);
}

.stat-card h2{
font-size:40px;
color:#38bdf8;
margin-bottom:10px;
}

.stat-card p{
color:#94a3b8;
}

/* SEARCH */

#searchBox{
width:100%;
padding:16px;
margin-bottom:25px;
background:#111827;
color:white;
border:none;
border-radius:12px;
font-size:16px;
outline:none;
}

#searchBox:focus{
border:1px solid #38bdf8;
}

/* BUTTONS */

.refresh{
background:#0ea5e9;
color:white;
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
margin-bottom:20px;
}

.refresh:hover{
background:#0284c7;
}

/* TABLE */

.table{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
background:#08111f;
border-radius:15px;
overflow:hidden;
}

th{
background:#111827;
padding:16px;
text-align:left;
color:#38bdf8;
}

td{
padding:16px;
border-bottom:1px solid #1f2937;
}

tr:hover{
background:#101d35;
}

.delete-btn{
background:#ef4444;
color:white;
padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
}

.delete-btn:hover{
background:#dc2626;
}

/* MOBILE */

@media(max-width:768px){

body{
padding:15px;
}

h1{
font-size:28px;
}

th,td{
font-size:14px;
padding:10px;
}

}

</style>

</head>

<body>

<h1>📩 Ayush AI Portfolio Dashboard</h1>

<button class="refresh" onclick="loadMessages()">
🔄 Refresh Messages
</button>

<div class="stats-grid">

<div class="stat-card">
<h2 id="totalMsg">0</h2>
<p>Total Messages</p>
</div>

<div class="stat-card">
<h2 id="todayMsg">0</h2>
<p>Today's Messages</p>
</div>

<div class="stat-card">
<h2 id="emailCount">0</h2>
<p>Unique Emails</p>
</div>

</div>

<input
id="searchBox"
placeholder="🔍 Search by Name or Email..."
>

<div class="table">

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Message</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="messageTable"></tbody>

</table>

</div>

<script>

const API="https://ayush-ai-backend.onrender.com";

let allMessages=[];

async function loadMessages(){

try{

const response=await fetch(API+"/messages");

allMessages=await response.json();

renderMessages(allMessages);

/* STATS */

document.getElementById("totalMsg").innerText=allMessages.length;

const uniqueEmails=[...new Set(allMessages.map(m=>m.email))];

document.getElementById("emailCount").innerText=uniqueEmails.length;

document.getElementById("todayMsg").innerText=allMessages.length;

}catch(err){

alert("Unable to load messages.");

}

}

function renderMessages(messages){

const table=document.getElementById("messageTable");

table.innerHTML="";

messages.forEach(msg=>{

table.innerHTML+=`
<tr>

<td>${msg.id}</td>

<td>${msg.name}</td>

<td>${msg.email}</td>

<td>${msg.message}</td>

<td>
<button class="delete-btn" onclick="deleteMessage(${msg.id})">
Delete
</button>
</td>

</tr>
`;

});

}

async function deleteMessage(id){

const ok=confirm("Delete this message?");

if(!ok) return;

await fetch(API+"/delete/"+id,{
method:"DELETE"
});

loadMessages();

}

/* SEARCH */

document.getElementById("searchBox").addEventListener("input",function(e){

const value=e.target.value.toLowerCase();

const filtered=allMessages.filter(msg=>

msg.name.toLowerCase().includes(value) ||
msg.email.toLowerCase().includes(value)

);

renderMessages(filtered);

});

/* AUTO REFRESH */

setInterval(loadMessages,10000);

loadMessages();

</script>

</body>
</html>
